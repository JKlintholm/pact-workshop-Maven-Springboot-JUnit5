name: Bare Repository

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Create bare clone
        run: |
          git clone --bare https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repository.git

      - name: Strip pull requests and internal refs
        run: |
          cd repository.git
          rm -rf refs/pull
          if [ -f packed-refs ]; then
            sed -i '/refs\/pull/d' packed-refs
          fi
          git reflog expire --expire=now --all
          git gc --prune=now
      
      - name: Package archive
        run: |
          tar -czvf bare-repo.tar.gz repository.git

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: bare-repo-archive
            path: bare-repo.tar.gz
            retention-days: 1
